name: Optimise supplied image library

on:
  push:
    paths:
      - 'assets/image-library/**'
      - '.github/workflows/optimise-image-library.yml'

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image optimiser
        run: npm install --no-save sharp
      - name: Convert every individual supplied image to WebP
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          const base = 'assets/image-library';
          const mappings = {
            'dog.png':'animals/dog.webp','cat.png':'animals/cat.webp','chicken.png':'animals/chicken.webp',
            'horse.png':'animals/horse.webp','wildlife.png':'animals/wildlife.webp','rabbit.png':'animals/rabbit.webp',
            'rodents.png':'animals/rodents.webp','reptile-exotic.png':'animals/reptile-exotic.webp',
            'namegame.png':'dogs/dog-name-recognition-training.webp','sittraining.png':'dogs/dog-sit-training.webp',
            'droptodog.png':'dogs/dog-down-position-training.webp','collargrab.png':'dogs/dog-collar-handling-training.webp',
            'trainingpaw.jpg':'dogs/dog-lead-training.webp','introducekong.png':'dogs/choosing-kong-toy.webp',
            'dogvomitguide.png':'dogs/dog-vomiting-guide.webp','adderbites.png':'wildlife/adder-bite-first-aid-guide.webp',
            'dominancetheory.png':'dogs/dog-dominance-theory-explainer.webp','allaboutdogfood.png':'dogs/dog-food-resource-graphic.webp',
            'felinegrimiclevel.png':'cats/feline-grimace-scale-resource.webp','rabbitwelfare.png':'partners/rabbit-welfare-association-fund.webp',
            'thebunnyjackpot.png':'partners/bunny-jackpot-foundation.webp','hayexpertslogo.png':'partners/the-hay-experts.webp',
            'allwindsfirstaid.png':'partners/allwinds-dog-first-aid.webp','thewildliefdirectory.jpg':'partners/help-wildlife.webp',
            'rescue2home.png':'partners/rescue-2-home-animal-support.webp','aqauticvegitation.png':'other/aquatic-vegetation-identification.webp',
            'heatth&saftey.png':'general/pet-health-and-safety.webp','puppytravel.png':'dogs/puppy-car-travel.webp',
            'easypeasydoggysqausy.png':'books/easy-peasy-doggy-squeezy-cover.webp','doggielangaue.png':'books/doggie-language-cover.webp',
            'whydoesmydogdothat.png':'books/why-does-my-dog-do-that-cover.webp','logo.png':'awards/sme-news-award-logo.webp',
            'animalenrichment.png':'general/animal-enrichment.webp','animalrescuetips.png':'general/animal-rescue-tips.webp',
            'dogdecoderbanner.png':'dogs/dog-decoder-banner.webp','loastandfoundadivce.png':'lost-found/lost-and-found-advice.webp',
            'nutravetlogo.png':'partners/nutravet.webp','r2hlarge.png':'partners/rescue-2-home-large.webp',
            'recommendedbooks.png':'books/recommended-animal-books.webp'
          };
          (async () => {
            for (const [source, relative] of Object.entries(mappings)) {
              const input = path.join(base, source);
              if (!fs.existsSync(input)) throw new Error('Missing supplied image: ' + input);
              const output = path.join('assets/images', relative);
              fs.mkdirSync(path.dirname(output), {recursive:true});
              await sharp(input).rotate().resize({width:1600,height:1200,fit:'inside',withoutEnlargement:true})
                .webp({quality:78,effort:5}).toFile(output);
              console.log(source + ' -> ' + output + ' (' + fs.statSync(output).size + ' bytes)');
            }
            // Contact sheets are retained as review references, not published as page artwork.
            const review = 'assets/image-review';
            fs.mkdirSync(review,{recursive:true});
            for (const name of fs.readdirSync(base).filter(n=>n.startsWith('Screenshot '))) {
              fs.copyFileSync(path.join(base,name),path.join(review,name));
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit optimised images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images assets/image-review
          if git diff --cached --quiet; then echo "No image changes."; else git commit -m "Optimise all supplied image library assets"; git push; fi
